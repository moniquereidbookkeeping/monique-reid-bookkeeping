name: Auto-Publish Blog Article

on:
  schedule:
    # Every Tuesday and Thursday at 9:00 AM ET (1:00 PM UTC)
    - cron: '0 13 * * 2,4'
  workflow_dispatch:
    inputs:
      topic_hint:
        description: 'Optional topic hint (leave blank for auto)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate article with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_HINT: ${{ github.event.inputs.topic_hint }}
        run: node .github/scripts/generate-article.mjs

      - name: Commit new article
        run: |
          git config user.name  "MR Bookkeeping Bot"
          git config user.email "moniquethebookkeeper@gmail.com"
          git add src/data/blogPosts.ts
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "content: auto-publish article — $(date '+%Y-%m-%d')"
          git push

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: publish
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL_USER }}
          password: ${{ secrets.NOTIFY_EMAIL_PASS }}
          to: moniquethebookkeeper@gmail.com
          from: MR Bookkeeping Bot <${{ secrets.NOTIFY_EMAIL_USER }}>
          subject: "⚠️ Auto-blog article failed to publish ($(date '+%Y-%m-%d'))"
          body: |
            The scheduled blog article generation failed on GitHub Actions.

            Run: ${{ github.run_id }}
            Triggered: ${{ github.event_name }}

            Check the Actions log for details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            No article was published today. You may want to trigger a manual run
            once the issue is resolved (use the "Run workflow" button on the Actions tab).
