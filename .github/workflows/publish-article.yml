name: Auto-Publish Blog Article

on:
  schedule:
    # Every Tuesday at 9:00 AM ET (1:00 PM UTC)
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      topic_hint:
        description: 'Optional topic hint (leave blank for auto)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate article with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          TOPIC_HINT: ${{ github.event.inputs.topic_hint }}
        run: node .github/scripts/generate-article.mjs

      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet src/data/blogPosts.ts; then
            echo "No changes — all topics already covered or no article generated."
            exit 0
          fi
          BRANCH="auto-article-$(date +%Y%m%d-%H%M)"
          git config user.name  "MR Bookkeeping Bot"
          git config user.email "moniquethebookkeeper@gmail.com"
          git checkout -b "$BRANCH"
          git add src/data/blogPosts.ts
          git commit -m "content: draft article — $(date '+%Y-%m-%d')"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "New blog article for review — $(date '+%Y-%m-%d')" \
            --body "An AI-drafted article is ready for your review before it goes live.

**Before merging, please check:**
- [ ] Facts and figures are accurate (especially any tax or accounting details)
- [ ] QuickBooks steps match your real workflow
- [ ] Tone matches Monique Reid Bookkeeping's voice
- [ ] No duplicate topic already covered on the site

Once merged, the article goes live automatically on its scheduled publishedDate — no further action needed."
