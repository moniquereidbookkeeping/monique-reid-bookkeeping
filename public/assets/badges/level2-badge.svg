<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="qb2-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <clipPath id="qb2-inner-clip">
      <path d="M 72 65 C 130 52 370 52 428 65 C 438 67 442 75 442 86 L 442 342 C 442 354 433 368 422 378 L 258 468 C 253 471 247 471 242 468 L 78 378 C 67 368 58 354 58 342 L 58 86 C 58 75 62 67 72 65 Z" />
    </clipPath>
  </defs>

  <g filter="url(#qb2-shadow)">
    <!-- Outer Shield Boundary (Dark Navy/Teal) -->
    <path d="M 72 62 C 130 49 370 49 428 62 C 440 65 446 74 446 88 L 446 342 C 446 356 436 372 424 382 L 258 473 C 253 476 247 476 242 473 L 76 382 C 64 372 54 356 54 342 L 54 88 C 54 74 60 65 72 62 Z" fill="#07353C" />

    <!-- Shield Inner Area with Clip -->
    <g clip-path="url(#qb2-inner-clip)">
      <!-- Top Section: Dark Navy/Teal -->
      <rect x="0" y="0" width="500" height="193" fill="#07353C" />

      <!-- Bottom Section: Apple Green (Matching QB2.png) -->
      <rect x="0" y="193" width="500" height="307" fill="#35CF57" />

      <!-- Green Section Diagonal Gloss Reflection -->
      <polygon points="50,193 300,193 160,370 50,300" fill="#FFFFFF" opacity="0.18" />

      <!-- Inner White Pinstripe Outline -->
      <path d="M 76 74 C 132 63 368 63 424 74 C 430 75 433 80 433 88 L 433 338 C 433 348 425 360 416 368 L 256 455 C 252 457 248 457 244 455 L 84 368 C 75 360 67 348 67 338 L 67 88 C 67 80 70 75 76 74 Z" 
            fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.95" />
    </g>

    <!-- INTUIT ProAdvisor Branding in Top Section -->
    <g transform="translate(250, 118)">
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="3.5">InTUIT</text>
      <text x="0" y="42" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="400" letter-spacing="0.8">ProAdvisor</text>
    </g>

    <!-- Bottom Section Content: QuickBooks Level 2 CERTIFIED -->
    <g transform="translate(250, 268)">
      <!-- QuickBooks -->
      <text x="0" y="0" text-anchor="middle" fill="#0C2025" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.3">QuickBooks</text>
      <!-- Level 2 -->
      <text x="0" y="48" text-anchor="middle" fill="#0C2025" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.3">Level 2</text>
      <!-- CERTIFIED -->
      <text x="0" y="112" text-anchor="middle" fill="#0C2025" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="4.5">CERTIFIED</text>
    </g>
  </g>
</svg>
