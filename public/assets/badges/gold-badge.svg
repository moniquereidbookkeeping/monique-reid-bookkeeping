<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="gold-tier-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <!-- Shield path for clipping inner elements -->
    <clipPath id="gold-inner-clip">
      <path d="M 72 65 C 130 52 370 52 428 65 C 438 67 442 75 442 86 L 442 342 C 442 354 433 368 422 378 L 258 468 C 253 471 247 471 242 468 L 78 378 C 67 368 58 354 58 342 L 58 86 C 58 75 62 67 72 65 Z" />
    </clipPath>
  </defs>

  <g filter="url(#gold-tier-shadow)">
    <!-- Outer Shield Boundary with Gold Outer Border -->
    <path d="M 72 62 C 130 49 370 49 428 62 C 440 65 446 74 446 88 L 446 342 C 446 356 436 372 424 382 L 258 473 C 253 476 247 476 242 473 L 76 382 C 64 372 54 356 54 342 L 54 88 C 54 74 60 65 72 62 Z" 
          fill="#07353C" stroke="#D8A229" stroke-width="5" />

    <!-- Shield Inner Area with Clip -->
    <g clip-path="url(#gold-inner-clip)">
      <!-- Base Dark Teal Fill -->
      <rect x="0" y="0" width="500" height="500" fill="#07353C" />

      <!-- Upper Diagonal Gloss Sheen -->
      <path d="M 50 60 L 450 60 L 450 195 L 255 195 L 50 100 Z" fill="#FFFFFF" opacity="0.05" />

      <!-- Middle Gold Banner -->
      <rect x="50" y="195" width="400" height="108" fill="#F8D352" />

      <!-- Gold Banner Diagonal Gloss Reflection -->
      <polygon points="50,195 295,195 185,303 50,303" fill="#FFFFFF" opacity="0.22" />

      <!-- Inner Gold Pinstripe Outline (Matching Official Intuit Gold Tier Badge) -->
      <path d="M 76 74 C 132 63 368 63 424 74 C 430 75 433 80 433 88 L 433 338 C 433 348 425 360 416 368 L 256 455 C 252 457 248 457 244 455 L 84 368 C 75 360 67 348 67 338 L 67 88 C 67 80 70 75 76 74 Z" 
            fill="none" stroke="#D8A229" stroke-width="3" />
    </g>

    <!-- INTUIT ProAdvisor Branding in Top Section -->
    <g transform="translate(250, 118)">
      <!-- InTUIT Wordmark -->
      <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="3.5">InTUIT</text>
      <!-- ProAdvisor -->
      <text x="0" y="42" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="400" letter-spacing="0.8">ProAdvisor</text>
    </g>

    <!-- Middle Banner Text: GOLD -->
    <text x="250" y="268" text-anchor="middle" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="2">GOLD</text>

    <!-- Bottom Section: Two Teal Stars -->
    <g fill="#156873">
      <!-- Left Star (centered around x=228, y=348) -->
      <polygon points="228,333 233,344 245,345 236,353 239,364 228,358 218,364 221,353 211,345 223,344" />
      <!-- Right Star (centered around x=272, y=348) -->
      <polygon points="272,333 277,344 289,345 280,353 283,364 272,358 262,364 265,353 255,345 267,344" />
    </g>
  </g>
</svg>
